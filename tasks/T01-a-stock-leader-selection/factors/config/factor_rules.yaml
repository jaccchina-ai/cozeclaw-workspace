"""
T01 选股系统 - 因子计算规则配置
"""

# 涨停质量因子配置
limit_quality:
  first_limit_time_weights:
    "10:00": 10
    "11:00": 8
    "13:30": 5
    "14:30": 3
    "23:59": 1
  limit_times_weights:
    0: 10
    1: 7
    2: 4
    3: -1
  consecutive_limit_weights:
    1: 6
    2: 10
    3: 8
    4: 5
    5: -1

# 封成比因子配置
seal_ratio:
  scoring_rules:
    - threshold: 1.0
      score: 10
    - threshold: 0.5
      score: 8
    - threshold: 0.3
      score: 6
    - threshold: 0.1
      score: 4
    - threshold: 0.0
      score: 2

# 封流比因子配置
seal_flow_ratio:
  scoring_rules:
    - threshold: 0.1
      score: 10
    - threshold: 0.05
      score: 8
    - threshold: 0.03
      score: 6
    - threshold: 0.01
      score: 4
    - threshold: 0.0
      score: 2

# 量比因子配置
volume_ratio:
  scoring_rules:
    - condition: "< 1"
      score: 4
    - condition: "< 2"
      score: 6
    - condition: "< 3"
      score: 8
    - condition: "< 5"
      score: 10
    - condition: "< 10"
      score: 6
    - condition: ">= 10"
      score: 3

# 真实换手率因子配置
turnover_rate:
  scoring_rules:
    - threshold: 5
      score: 6
      operator: "<"
    - threshold: 15
      score: 10
      operator: "<"
    - threshold: 20
      score: 8
      operator: "<"
    - threshold: 25
      score: 6
      operator: "<"
    - threshold: 30
      score: 4
      operator: "<"
    - threshold: 30
      score: 2
      operator: ">="

# MA3乖离率因子配置
bias_ma3:
  scoring_rules:
    - threshold: 3
      score: 10
      operator: "<"
    - threshold: 6
      score: 8
      operator: "<"
    - threshold: 9
      score: 6
      operator: "<"
    - threshold: 12
      score: 3
      operator: "<"
    - threshold: 12
      score: 1
      operator: ">="
